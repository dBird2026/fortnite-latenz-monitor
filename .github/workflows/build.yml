name: Build

# Jeder Push auf main: Tests -> Container-Image (ghcr.io, Tag "latest") + Windows-ZIP (Release "latest").
# Ein Tag v1.2.3 erzeugt zusätzlich ein festes Release und ein Image mit Versionsnummer.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes monitor tests
      - run: python -m pytest -q

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onedir --console --name FortniteLatenzMonitor
          --add-data "monitor/static;monitor/static"
          --hidden-import speedtest
          run_monitor.py
      - name: Smoke test
        shell: pwsh
        run: |
          $env:FLM_DATA_DIR = Join-Path $env:RUNNER_TEMP "flm-data"
          $env:FLM_BROWSER = "0"
          & dist\FortniteLatenzMonitor\FortniteLatenzMonitor.exe status
          if ($LASTEXITCODE -ne 0) { throw "status fehlgeschlagen" }
          & dist\FortniteLatenzMonitor\FortniteLatenzMonitor.exe einmal
          if ($LASTEXITCODE -ne 0) { throw "einmal fehlgeschlagen" }
          & dist\FortniteLatenzMonitor\FortniteLatenzMonitor.exe status
      - name: Package
        shell: pwsh
        run: |
          Copy-Item windows\* dist\FortniteLatenzMonitor\
          Compress-Archive -Path dist\FortniteLatenzMonitor\* -DestinationPath FortniteLatenzMonitor-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FortniteLatenzMonitor-windows
          path: FortniteLatenzMonitor-windows.zip
      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest FortniteLatenzMonitor-windows.zip --prerelease --target $env:GITHUB_SHA `
            --title "Aktueller Stand (automatisch)" `
            --notes "Automatischer Build von $($env:GITHUB_SHA.Substring(0,7)). ZIP entpacken und 1_Messung_starten.cmd ausfuehren."
      - name: Versions-Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $env:GITHUB_REF_NAME FortniteLatenzMonitor-windows.zip --title $env:GITHUB_REF_NAME --generate-notes
